<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a4a"/></marker>
<marker id="ab" markerWidth="8" markerHeight="6.5" refX="7" refY="3.25" orient="auto"><path d="M0,0 L8,3.25 L0,6.5 z" fill="#12294d"/></marker>
<marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#7a7a8c"/></marker>
</defs>
<rect width="760" height="1000" fill="#ffffff"/>

<text x="15" y="28" font-size="20" font-weight="bold" fill="#15151f">Stage 2 &#8212; Training: competence-weighted distillation</text>
<text x="15" y="50" font-size="13" fill="#55556a">Repeated at every training step. Teachers arrive frozen from Figure 1; no LLM is called here.</text>
<line x1="15" y1="62" x2="745" y2="62" stroke="#d8d8e2" stroke-width="1.2"/>

<!-- ===== REAL LOOP ===== -->
<rect x="15" y="76" width="730" height="196" rx="8" fill="#f7f9fc" stroke="#c3cede" stroke-width="1.4"/>
<text x="32" y="96" font-size="12" font-weight="bold" fill="#5b6b86" letter-spacing="0.8">THE REAL LOOP &#8212; UNCHANGED FROM STANDARD MAPPO</text>

<rect x="220" y="106" width="320" height="56" rx="6" fill="#eef1f6" stroke="#5b6b86" stroke-width="1.8"/>
<text x="380" y="128" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3a52">Environment</text>
<text x="380" y="148" font-size="12.5" text-anchor="middle" fill="#4a5a76">aircraft, weather cells, sector boundary</text>

<rect x="220" y="212" width="320" height="52" rx="6" fill="#dde6f2" stroke="#1b3a6b" stroke-width="2.2"/>
<text x="380" y="233" font-size="15" font-weight="bold" text-anchor="middle" fill="#12294d">MAPPO</text>
<text x="380" y="252" font-size="12.5" text-anchor="middle" fill="#1b3a6b">actor per aircraft + centralised critic</text>

<line x1="300" y1="162" x2="300" y2="208" stroke="#3a3a4a" stroke-width="1.8" marker-end="url(#a)"/>
<text x="309" y="190" font-size="12.5" fill="#3a3a4a">observation</text>

<line x1="460" y1="212" x2="460" y2="166" stroke="#12294d" stroke-width="4" marker-end="url(#ab)"/>
<text x="472" y="184" font-size="12.5" font-weight="bold" fill="#12294d">the turn MAPPO chose</text>
<text x="472" y="200" font-size="12" fill="#12294d">the only action executed</text>

<!-- dashed branch to teachers, routed left of MAPPO -->
<path d="M300,185 L130,185 L130,300" fill="none" stroke="#7a7a8c" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ag)"/>
<text x="140" y="252" font-size="12" fill="#6a6a7e">the same</text>
<text x="140" y="267" font-size="12" fill="#6a6a7e">observation,</text>
<text x="140" y="282" font-size="12" fill="#6a6a7e">copied</text>

<!-- ===== TEACHERS ===== -->
<text x="15" y="322" font-size="12" font-weight="bold" fill="#6a6a7e" letter-spacing="0.8">1. THE THREE FROZEN TEACHERS EACH PROPOSE A TURN</text>
<rect x="15" y="332" width="230" height="70" rx="6" fill="#f0ecf7" stroke="#6b4c9a" stroke-width="1.8"/>
<text x="130" y="354" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4c356e">LLM teacher</text>
<text x="130" y="373" font-size="12" text-anchor="middle" fill="#4c356e">a spread over the 13 turns</text>
<text x="130" y="392" font-size="12" text-anchor="middle" fill="#7a6a94">safer around storms</text>

<rect x="265" y="332" width="230" height="70" rx="6" fill="#e7f2f0" stroke="#1f7a6b" stroke-width="1.8"/>
<text x="380" y="354" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#14574c">BP teacher</text>
<text x="380" y="373" font-size="12" text-anchor="middle" fill="#14574c">a spread over the 13 turns</text>
<text x="380" y="392" font-size="12" text-anchor="middle" fill="#4d8a7e">favours progress</text>

<rect x="515" y="332" width="230" height="70" rx="6" fill="#f8f0e2" stroke="#b5761f" stroke-width="1.8"/>
<text x="630" y="354" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#84550f">PS teacher</text>
<text x="630" y="373" font-size="12" text-anchor="middle" fill="#84550f">a spread over the 13 turns</text>
<text x="630" y="392" font-size="12" text-anchor="middle" fill="#a3853f">safer around aircraft</text>

<path d="M130,402 L130,424" stroke="#7a7a8c" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ag)"/>
<path d="M380,402 L380,424" stroke="#7a7a8c" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ag)"/>
<path d="M630,402 L630,424" stroke="#7a7a8c" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ag)"/>

<!-- ===== SHADOW ===== -->
<text x="15" y="446" font-size="12" font-weight="bold" fill="#6a6a7e" letter-spacing="0.8">2. SHADOW VALIDATION &#8212; WOULD THAT ADVICE ACTUALLY HAVE HELPED?</text>
<rect x="15" y="456" width="730" height="188" rx="8" fill="#fcfcfd" stroke="#8f8fa3" stroke-width="1.6"/>
<text x="32" y="478" font-size="13" fill="#44445a">Clone the simulator. Run four branches. Each starts with a different first turn,</text>
<text x="32" y="495" font-size="13" fill="#44445a">then continues five steps under deterministic MAPPO.</text>

<text x="32" y="518" font-size="11.5" fill="#8a8a9c">first turn</text>
<text x="140" y="518" font-size="11.5" fill="#8a8a9c">then five more steps</text>
<text x="410" y="518" font-size="11.5" fill="#8a8a9c">return</text>

<rect x="32" y="524" width="96" height="21" rx="3" fill="#dde6f2" stroke="#1b3a6b" stroke-width="1.4"/>
<text x="80" y="539" font-size="12" text-anchor="middle" fill="#12294d">MAPPO</text>
<rect x="136" y="524" width="256" height="21" rx="3" fill="#f0f0f4" stroke="#b8b8c6"/>
<text x="264" y="539" font-size="11.5" text-anchor="middle" fill="#7a7a8c">MAPPO &#215; 5</text>
<text x="404" y="539" font-size="12.5" font-weight="bold" fill="#12294d">G(MAPPO)</text>
<text x="482" y="539" font-size="11.5" fill="#8a8a9c">&#8592; the reference to beat</text>

<rect x="32" y="551" width="96" height="21" rx="3" fill="#f0ecf7" stroke="#6b4c9a" stroke-width="1.4"/>
<text x="80" y="566" font-size="12" text-anchor="middle" fill="#4c356e">LLM</text>
<rect x="136" y="551" width="256" height="21" rx="3" fill="#f0f0f4" stroke="#b8b8c6"/>
<text x="264" y="566" font-size="11.5" text-anchor="middle" fill="#7a7a8c">MAPPO &#215; 5</text>
<text x="404" y="566" font-size="12.5" font-weight="bold" fill="#4c356e">G(LLM)</text>

<rect x="32" y="578" width="96" height="21" rx="3" fill="#e7f2f0" stroke="#1f7a6b" stroke-width="1.4"/>
<text x="80" y="593" font-size="12" text-anchor="middle" fill="#14574c">BP</text>
<rect x="136" y="578" width="256" height="21" rx="3" fill="#f0f0f4" stroke="#b8b8c6"/>
<text x="264" y="593" font-size="11.5" text-anchor="middle" fill="#7a7a8c">MAPPO &#215; 5</text>
<text x="404" y="593" font-size="12.5" font-weight="bold" fill="#14574c">G(BP)</text>

<rect x="32" y="605" width="96" height="21" rx="3" fill="#f8f0e2" stroke="#b5761f" stroke-width="1.4"/>
<text x="80" y="620" font-size="12" text-anchor="middle" fill="#84550f">PS</text>
<rect x="136" y="605" width="256" height="21" rx="3" fill="#f0f0f4" stroke="#b8b8c6"/>
<text x="264" y="620" font-size="11.5" text-anchor="middle" fill="#7a7a8c">MAPPO &#215; 5</text>
<text x="404" y="620" font-size="12.5" font-weight="bold" fill="#84550f">G(PS)</text>

<text x="482" y="595" font-size="11.5" fill="#8a8a9c">All four run in a</text>
<text x="482" y="611" font-size="11.5" fill="#8a8a9c">throwaway copy. The</text>
<text x="482" y="627" font-size="11.5" fill="#8a8a9c">real episode is untouched.</text>

<line x1="380" y1="644" x2="380" y2="666" stroke="#7a7a8c" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ag)"/>

<!-- ===== WEIGHTS ===== -->
<text x="15" y="688" font-size="12" font-weight="bold" fill="#6a6a7e" letter-spacing="0.8">3. TURN THE RESULT INTO A WEIGHT FOR EACH TEACHER</text>
<rect x="15" y="698" width="730" height="118" rx="8" fill="#fbf8ee" stroke="#b5761f" stroke-width="1.6"/>
<rect x="32" y="712" width="330" height="26" rx="4" fill="#ffffff" stroke="#d8c9a8"/>
<text x="44" y="730" font-size="13" fill="#3a3a4a">improvement = G(teacher) &#8722; G(MAPPO)</text>
<circle cx="40" cy="757" r="3.5" fill="#a8484d"/>
<text x="52" y="761" font-size="12.5" fill="#7a3438">no better than MAPPO &#8594; weight = 0, the teacher is ignored this step</text>
<circle cx="40" cy="781" r="3.5" fill="#1f7a6b"/>
<text x="52" y="785" font-size="12.5" fill="#14574c">better than MAPPO &#8594; the weight grows with the size of the improvement</text>
<text x="32" y="806" font-size="12.5" fill="#5c4a22">Each weight blends the gain for the one aircraft (65%) and for the team (35%).</text>

<line x1="380" y1="816" x2="380" y2="838" stroke="#7a7a8c" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ag)"/>

<!-- ===== LOSS ===== -->
<text x="15" y="860" font-size="12" font-weight="bold" fill="#6a6a7e" letter-spacing="0.8">4. THE LOSS MAPPO ACTUALLY LEARNS FROM</text>
<rect x="15" y="870" width="730" height="76" rx="8" fill="#eef1f6" stroke="#1b3a6b" stroke-width="1.8"/>
<text x="380" y="894" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#12294d">total loss = ordinary PPO loss + &#931; [ weight &#215; distance( MAPPO's turns , teacher's turns ) ]</text>
<text x="380" y="914" font-size="12.5" text-anchor="middle" fill="#2c3a52">A teacher weighted zero contributes nothing. One that clearly helped pulls MAPPO towards its choice.</text>
<text x="380" y="935" font-size="12.5" font-style="italic" text-anchor="middle" fill="#4a5a76">This is a teacher's only route of influence: it changes how MAPPO learns, never what the aircraft do.</text>

<path d="M745,908 L753,908 L753,238 L545,238" fill="none" stroke="#1b3a6b" stroke-width="2" marker-end="url(#ab)"/>
<text x="744" y="580" font-size="12" font-weight="bold" fill="#12294d" transform="rotate(-90 750,580)" text-anchor="middle">gradient update</text>

<!-- ===== LEGEND ===== -->
<rect x="15" y="958" width="730" height="34" rx="6" fill="#fdf4f4" stroke="#a8484d" stroke-width="1.4"/>
<line x1="30" y1="971" x2="66" y2="971" stroke="#12294d" stroke-width="4"/>
<text x="74" y="975" font-size="12" fill="#3a3a4a">acts in the real environment</text>
<line x1="300" y1="971" x2="336" y2="971" stroke="#7a7a8c" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="344" y="975" font-size="12" fill="#3a3a4a">influences learning only &#8212; every teacher path is of this kind</text>
</svg>
