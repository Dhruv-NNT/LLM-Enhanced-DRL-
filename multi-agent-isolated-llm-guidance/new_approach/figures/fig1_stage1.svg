<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a4a"/></marker>
<marker id="al" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#6b4c9a"/></marker>
<marker id="ab" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#1f7a6b"/></marker>
<marker id="ap" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#b5761f"/></marker>
</defs>
<rect width="760" height="640" fill="#ffffff"/>

<text x="15" y="28" font-size="20" font-weight="bold" fill="#15151f">Stage 1 &#8212; Offline: turning three guides into teachers</text>
<text x="15" y="50" font-size="13" fill="#55556a">Done once, before MAPPO training begins.</text>
<line x1="15" y1="62" x2="745" y2="62" stroke="#d8d8e2" stroke-width="1.2"/>

<rect x="240" y="76" width="280" height="46" rx="6" fill="#f2f2f7" stroke="#8f8fa3" stroke-width="1.6"/>
<text x="380" y="96" font-size="15" font-weight="bold" text-anchor="middle" fill="#22222e">Simulator</text>
<text x="380" y="114" font-size="12.5" text-anchor="middle" fill="#55556a">4 aircraft &#183; 2 weather cells &#183; 13 turns</text>

<line x1="380" y1="122" x2="380" y2="140" stroke="#3a3a4a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="386" y="124" width="250" height="16" fill="#ffffff"/>
<text x="390" y="136" font-size="12.5" fill="#55556a">each guide flies whole episodes alone</text>

<line x1="130" y1="146" x2="630" y2="146" stroke="#3a3a4a" stroke-width="1.8"/>
<line x1="130" y1="146" x2="130" y2="166" stroke="#6b4c9a" stroke-width="2" marker-end="url(#al)"/>
<line x1="380" y1="146" x2="380" y2="166" stroke="#1f7a6b" stroke-width="2" marker-end="url(#ab)"/>
<line x1="630" y1="146" x2="630" y2="166" stroke="#b5761f" stroke-width="2" marker-end="url(#ap)"/>

<rect x="15" y="174" width="230" height="80" rx="6" fill="#f0ecf7" stroke="#6b4c9a" stroke-width="1.8"/>
<text x="130" y="196" font-size="15" font-weight="bold" text-anchor="middle" fill="#4c356e">LLM guide</text>
<text x="130" y="215" font-size="12.5" text-anchor="middle" fill="#4c356e">gpt-oss-20B, prompted with</text>
<text x="130" y="232" font-size="12.5" text-anchor="middle" fill="#4c356e">ranked threats and a list of</text>
<text x="130" y="249" font-size="12.5" text-anchor="middle" fill="#4c356e">pre-checked safe turns</text>

<rect x="265" y="174" width="230" height="80" rx="6" fill="#e7f2f0" stroke="#1f7a6b" stroke-width="1.8"/>
<text x="380" y="196" font-size="15" font-weight="bold" text-anchor="middle" fill="#14574c">Best preview (BP)</text>
<text x="380" y="215" font-size="12.5" text-anchor="middle" fill="#14574c">rule: take the top-ranked</text>
<text x="380" y="232" font-size="12.5" text-anchor="middle" fill="#14574c">safe turn from that list</text>
<text x="380" y="249" font-size="12.5" text-anchor="middle" fill="#4d8a7e">favours progress</text>

<rect x="515" y="174" width="230" height="80" rx="6" fill="#f8f0e2" stroke="#b5761f" stroke-width="1.8"/>
<text x="630" y="196" font-size="15" font-weight="bold" text-anchor="middle" fill="#84550f">Preview safe (PS)</text>
<text x="630" y="215" font-size="12.5" text-anchor="middle" fill="#84550f">rule: take a turn at random</text>
<text x="630" y="232" font-size="12.5" text-anchor="middle" fill="#84550f">from that same list</text>
<text x="630" y="249" font-size="12.5" text-anchor="middle" fill="#a3853f">favours separation</text>

<line x1="130" y1="254" x2="130" y2="292" stroke="#6b4c9a" stroke-width="2" marker-end="url(#al)"/>
<line x1="380" y1="254" x2="380" y2="292" stroke="#1f7a6b" stroke-width="2" marker-end="url(#ab)"/>
<line x1="630" y1="254" x2="630" y2="292" stroke="#b5761f" stroke-width="2" marker-end="url(#ap)"/>
<rect x="235" y="264" width="290" height="16" fill="#ffffff"/>
<text x="380" y="276" font-size="12.5" text-anchor="middle" fill="#55556a">record every (situation, turn) pair</text>

<rect x="30" y="300" width="200" height="40" rx="6" fill="#fafafc" stroke="#6b4c9a" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="130" y="318" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#4c356e">LLM dataset</text>
<text x="130" y="334" font-size="12" text-anchor="middle" fill="#55556a">demonstrations</text>
<rect x="280" y="300" width="200" height="40" rx="6" fill="#fafafc" stroke="#1f7a6b" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="380" y="318" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#14574c">BP dataset</text>
<text x="380" y="334" font-size="12" text-anchor="middle" fill="#55556a">demonstrations</text>
<rect x="530" y="300" width="200" height="40" rx="6" fill="#fafafc" stroke="#b5761f" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="630" y="318" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#84550f">PS dataset</text>
<text x="630" y="334" font-size="12" text-anchor="middle" fill="#55556a">demonstrations</text>

<line x1="130" y1="340" x2="130" y2="378" stroke="#6b4c9a" stroke-width="2" marker-end="url(#al)"/>
<line x1="380" y1="340" x2="380" y2="378" stroke="#1f7a6b" stroke-width="2" marker-end="url(#ab)"/>
<line x1="630" y1="340" x2="630" y2="378" stroke="#b5761f" stroke-width="2" marker-end="url(#ap)"/>
<rect x="215" y="350" width="330" height="16" fill="#ffffff"/>
<text x="380" y="362" font-size="12.5" text-anchor="middle" fill="#55556a">train a small network to copy those choices</text>

<rect x="15" y="386" width="230" height="66" rx="6" fill="#6b4c9a" stroke="#4c356e" stroke-width="1.8"/>
<text x="130" y="410" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">LLM teacher</text>
<text x="130" y="428" font-size="12.5" text-anchor="middle" fill="#e8e0f3">small network &#183; frozen</text>
<text x="130" y="445" font-size="12.5" text-anchor="middle" fill="#e8e0f3">answers in milliseconds</text>

<rect x="265" y="386" width="230" height="66" rx="6" fill="#1f7a6b" stroke="#14574c" stroke-width="1.8"/>
<text x="380" y="410" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">BP teacher</text>
<text x="380" y="428" font-size="12.5" text-anchor="middle" fill="#dcefea">small network &#183; frozen</text>
<text x="380" y="445" font-size="12.5" text-anchor="middle" fill="#dcefea">answers in milliseconds</text>

<rect x="515" y="386" width="230" height="66" rx="6" fill="#b5761f" stroke="#84550f" stroke-width="1.8"/>
<text x="630" y="410" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">PS teacher</text>
<text x="630" y="428" font-size="12.5" text-anchor="middle" fill="#f7ead6">small network &#183; frozen</text>
<text x="630" y="445" font-size="12.5" text-anchor="middle" fill="#f7ead6">answers in milliseconds</text>

<line x1="380" y1="452" x2="380" y2="484" stroke="#3a3a4a" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="150" y="492" width="460" height="36" rx="6" fill="#eef1f6" stroke="#5b6b86" stroke-width="1.6"/>
<text x="380" y="515" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3a52">The three frozen teachers pass to Stage 2 (Figure 2)</text>

<rect x="15" y="552" width="730" height="76" rx="6" fill="#fdf4f4" stroke="#a8484d" stroke-width="1.6"/>
<text x="32" y="576" font-size="14" font-weight="bold" fill="#8a2f34">Why this stage exists</text>
<text x="32" y="597" font-size="13" fill="#6b3438">The language model is queried thousands of times here, and then never again.</text>
<text x="32" y="616" font-size="13" fill="#6b3438">During MAPPO training no LLM is called, which is what makes training fast.</text>
</svg>
